[project]
name = "counsel"
version = "0.1.0"
description = "Ask questions about HMRC tax guidance and get answers that show their sources."
readme = "README.md"
authors = [
    { name = "Michael Groves", email = "michaeliangroves@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
counsel = "counsel:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

